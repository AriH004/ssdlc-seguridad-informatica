name: Monorepo CI
on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: monorepo-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.32.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - if: matrix.app == 'frontend'
        run: pnpm openapi:check
      - run: pnpm build
  security:
    name: Security gates (SAST, SCA, Secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - name: Gitleaks secret scan
        run: node tooling/security-tools.mjs gitleaks-ci
      - name: Workflows validation (actionlint)
        run: node tooling/security-tools.mjs actionlint
      - name: Tooling release-gate tests
        run: node --test tooling/tests/release-gate.test.mjs tooling/tests/agent-wrapper.test.mjs
      - name: OSV-Scanner (SCA dependencies)
        run: node tooling/security-tools.mjs osv-scanner --format=sarif --output=osv-report.sarif
      - name: Semgrep CE (SAST code analysis)
        run: |
          mkdir -p reports
          docker run --rm -v "${{ github.workspace }}:/src" semgrep/semgrep:1.185.0 semgrep scan --config=.semgrep/ --config=p/owasp-top-ten --config=p/react --config=p/typescript --sarif --output=/src/reports/semgrep.sarif --error
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: security-reports-${{ github.sha }}
          path: |
            osv-report.sarif
            reports/semgrep.sarif
          if-no-files-found: ignore
          retention-days: 30
  dependencies:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
  migration-replay:
    name: Backend migration replay
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.32.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: node tooling/migration-replay.mjs
  authz-tests:
    name: Authz tests
    # Ítem 4.5: pruebas de autorización directo a la API, sin base de datos ni secretos.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.32.1
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Run authorization tests
        run: pnpm test:authz 2>&1 | tee authz-report.txt
        shell: bash
      - name: Upload authorization report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: authz-report-${{ github.sha }}
          path: backend/authz-report.txt
          if-no-files-found: error
  images:
    name: Candidate image (${{ matrix.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    env:
      APP: ${{ matrix.app }}
      COMMIT: ${{ github.sha }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_BACKEND_URL: ${{ vars.NEXT_PUBLIC_BACKEND_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - name: Prepare PR-only public frontend placeholders
        if: matrix.app == 'frontend' && github.event_name == 'pull_request'
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo 'NEXT_PUBLIC_SUPABASE_URL=https://ci-placeholder.invalid' >> "$GITHUB_ENV"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo 'NEXT_PUBLIC_SUPABASE_ANON_KEY=ci-public-placeholder' >> "$GITHUB_ENV"
          fi
          if [ -z "$NEXT_PUBLIC_BACKEND_URL" ]; then
            echo 'NEXT_PUBLIC_BACKEND_URL=https://api-ci-placeholder.invalid' >> "$GITHUB_ENV"
          fi
      - name: Build candidate once
        shell: bash
        run: |
          args=()
          if [ "$APP" = frontend ]; then
            : "${NEXT_PUBLIC_SUPABASE_URL:?Configure public Supabase URL in repository variables}"
            : "${NEXT_PUBLIC_SUPABASE_ANON_KEY:?Configure public anon key, never service_role}"
            : "${NEXT_PUBLIC_BACKEND_URL:?Configure public backend URL}"
            args+=(--build-arg NEXT_PUBLIC_SUPABASE_URL --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY --build-arg NEXT_PUBLIC_BACKEND_URL)
          fi
          docker build --build-arg VCS_REF="$COMMIT" "${args[@]}" -t "resdigital-$APP:$COMMIT" "$APP"
      - name: Check runtime and export the tested image
        run: node tooling/image-candidate.mjs verify "$APP" "$COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-${{ matrix.app }}-${{ github.sha }}
          path: image-artifacts/
          if-no-files-found: error
          retention-days: 7
  publish:
    name: Publish tested images
    if: always() && !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/development'
    needs: [quality, security, dependencies, migration-replay, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.14.0
          package-manager-cache: false
      - name: Enforce all required results before publication
        env:
          RELEASE_GATE_CLI: 'true'
          RESULTS: ${{ toJson(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: node tooling/release-gate.mjs
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: candidate-*-${{ github.sha }}
          path: image-artifacts/
          merge-multiple: true
      - name: Authenticate to Docker Hub
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        shell: bash
        run: |
          : "${DOCKERHUB_USERNAME:?Configure Docker Hub username}"
          : "${DOCKERHUB_TOKEN:?Configure protected Docker Hub token}"
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username "$DOCKERHUB_USERNAME" --password-stdin
      - name: Publish existing approved candidates without rebuilding
        env:
          COMMIT: ${{ github.sha }}
        run: |
          node tooling/image-candidate.mjs publish backend "$COMMIT"
          node tooling/image-candidate.mjs publish frontend "$COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: published-digests-${{ github.sha }}
          path: image-artifacts/*-published.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove runner registry session
        if: always()
        run: docker logout
  required:
    name: Monorepo required
    if: always()
    needs: [quality, security, dependencies, migration-replay, authz-tests, images, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require successful checks
        env:
          RESULTS: ${{ toJson(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const jobs = JSON.parse(process.env.RESULTS);
          for (const [name, job] of Object.entries(jobs)) {
            if (name === 'dependencies' && process.env.EVENT_NAME !== 'pull_request' && job.result === 'skipped') continue;
            if (name === 'publish' && (process.env.EVENT_NAME !== 'push' || process.env.REF_NAME !== 'refs/heads/development') && job.result === 'skipped') continue;
            if (job.result !== 'success') throw new Error(name + ': ' + job.result);
          }
          NODE
